<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Counter - Finance Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .scalable-content {
            font-size: 1rem;
        }

        .scalable-content.font-large {
            font-size: 1.25rem;
        }

        .scalable-content.font-extra-large {
            font-size: 1.5rem;
        }

        .reduced-scale {
            font-size: 0.95rem;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
        }

        .no-scale {
            font-size: 1rem !important;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950">
    <div id="app"></div>

    <script>
        // ==================== CURRENCY CONFIGURATION ====================
        const CURRENCY_DATA = {
            EUR: {
                name: 'Euro',
                code: 'EUR',
                flag: '🇪🇺',

                denominations: [

                ]
            },
            GBP: {

                code: 'GBP',
                flag: '🇬🇧',
                symbol: '£',
                denominations: [
                    { value: 50, label: '£50', type: 'bill' },
                    { value: 20, label: '£20', type: 'bill' },
                    { value: 10, label: '£10', type: 'bill' },

                    { value: 1000, label: '¥1000', type: 'bill' },
                    { value: 500, label: '¥500', type: 'coin' },

                ]
            },
            KRW: {
                name: 'Korean Won',
                code: 'KRW',
                flag: '🇰🇷',
                symbol: '₩',
                denominations: [
                    { value: 50000, label: '₩50000', type: 'bill' },
                    { value: 10000, label: '₩10000', type: 'bill' },
                    { value: 5000, label: '₩5000', type: 'bill' },
                    { value: 1000, label: '₩1000', type: 'bill' },
                    { value: 500, label: '₩500', type: 'coin' },
                    { value: 100, label: '₩100', type: 'coin' },
                    { value: 50, label: '₩50', type: 'coin' },
                    { value: 10, label: '₩10', type: 'coin' }
                ]
            }
        };

        const LANGUAGES = [
            { code: 'en', name: 'English', flag: '🇺🇸' },
            { code: 'ko', name: '한국어', flag: '🇰🇷' }
        ];

        const TRANSLATIONS = {
            en: {
                'title': 'Cash Counter',
                'named': 'Named',
                'anonymous': 'Anonymous',
                'bills': 'Bills',
                'coins': 'Coins',
                'denomination': 'Denomination',
                'namedTotal': 'Named Total',
                'anonymousTotal': 'Anonymous Total',
                'grandTotal': 'Grand Total',
                'transactionsTotal': 'Transactions Total',
                'match': 'Match!',
                'excess': 'Excess',
                'shortage': 'Shortage',
                'clearAll': 'Clear All',
                'share': 'Share',
                'copied': 'Copied!',
                'confirmClearAll': 'Are you sure you want to clear all counts?',
                'targetAmount': 'Target Amount (optional, for comparison)'
            },
            ko: {
                'title': '현금 카운터',
                'named': '이름있음',
                'anonymous': '이름없음',
                'bills': '지폐',
                'coins': '동전',
                'denomination': '금액',
                'namedTotal': '이름있음 합계',
                'anonymousTotal': '이름없음 합계',
                'grandTotal': '전체 합계',
                'transactionsTotal': '거래 합계',
                'match': '일치!',
                'excess': '초과',
                'shortage': '부족',
                'clearAll': '모두 삭제',
                'share': '공유',
                'copied': '복사됨!',
                'confirmClearAll': '모든 카운트를 삭제하시겠습니까?',
                'targetAmount': '목표 금액 (선택, 비교용)'
            }
        };

        // ==================== UTILITY FUNCTIONS ====================
        const getLocalDateString = () => {
            const date = new Date();
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const createEmptyState = (currency) => {
            const state = {};
            CURRENCY_DATA[currency].denominations.forEach(d => {
                state[d.value] = 0;
            });
            return state;
        };

        const getDenominations = (currency) => CURRENCY_DATA[currency].denominations;
        const getCurrencyInfo = (currency) => CURRENCY_DATA[currency];
        const getSupportedCurrencies = () => Object.values(CURRENCY_DATA);

        const calculateDenominationTotal = (state, currency) => {
            return Object.entries(state).reduce((sum, [value, count]) => {
                return sum + (parseFloat(value) * count);
            }, 0);
        };

        const calculateDenominationBreakdown = (state, currency) => {
            const denominations = getDenominations(currency);
            let bills = 0, coins = 0;
            
            Object.entries(state).forEach(([value, count]) => {
                const denomination = denominations.find(d => d.value === parseFloat(value));
                if (denomination) {
                    if (denomination.type === 'bill') {
                        bills += parseFloat(value) * count;
                    } else {
                        coins += parseFloat(value) * count;
                    }
                }
            });
            
            return { bills, coins };
        };

        const filterDenominationsByType = (denominations, type) => {
            return denominations.filter(d => d.type === type);
        };

        const getDenominationsWithData = (denominations, anonymousState, namedState) => {
            return denominations.filter(d => {
                return (anonymousState[d.value] || 0) > 0 || (namedState[d.value] || 0) > 0;
            });
        };

        const formatCurrencyAmount = (amount, currency) => {
            const symbol = getCurrencyInfo(currency).symbol;
            return `${symbol}${amount.toFixed(2)}`;
        };

        const t = (key, lang = 'en') => {
            return TRANSLATIONS[lang]?.[key] || key;
        };

        // ==================== APPLICATION STATE ====================
        class CashCounterApp {
            constructor() {
                this.state = {
                    anonymous: createEmptyState('EUR'),
                    namedCounts: createEmptyState('EUR')
                };
                this.config = {
                    currency: 'EUR',
                    targetAmount: 0
                };
                this.language = 'en';
                this.fontSize = 'normal';
                this.showConfig = false;
                this.copySuccess = false;
                this.currencyChange = {
                    showCurrencyConfirm: false,
                    pendingCurrency: null
                };
                this.saveTimeout = null;
                
                this.loadFromStorage();
                this.render();
            }

            loadFromStorage() {
                const storedConfig = localStorage.getItem('cashcounter_config');
                if (storedConfig) {
                    try {
                        this.config = JSON.parse(storedConfig);
                    } catch (err) {
                        console.error('Error loading config:', err);
                    }
                }

                const storageKey = 'cashcounter_standalone';
                try {
                    const stored = localStorage.getItem(storageKey);
                    if (stored) {
                        const data = JSON.parse(stored);
                        const today = getLocalDateString();
                        
                        if (data.lastDate !== today) {
                            localStorage.removeItem(storageKey);
                            return;
                        }

                        if (data.version === 3 && typeof data.anonymous === 'object' && typeof data.namedCounts === 'object') {
                            this.state = {
                                anonymous: data.anonymous,
                                namedCounts: data.namedCounts
                            };
                            if (data.currency) {
                                this.config.currency = data.currency;
                            }
                        }
                    }
                } catch (err) {
                    console.error('Error loading data:', err);
                }

                const storedLang = localStorage.getItem('cashcounter_language');
                if (storedLang) {
                    this.language = storedLang;
                }

                const storedFontSize = localStorage.getItem('cashcounter_fontsize');
                if (storedFontSize) {
                    this.fontSize = storedFontSize;
                }
            }

            saveToStorage() {
                if (this.saveTimeout) {
                    clearTimeout(this.saveTimeout);
                }

                this.saveTimeout = setTimeout(() => {
                    const storageKey = 'cashcounter_standalone';
                    try {
                        const data = {
                            version: 3,
                            anonymous: this.state.anonymous,
                            namedCounts: this.state.namedCounts,
                            lastDate: getLocalDateString(),
                            currency: this.config.currency
                        };
                        localStorage.setItem(storageKey, JSON.stringify(data));
                    } catch (err) {
                        console.error('Error saving data:', err);
                    }
                }, 500);
            }

            saveConfig() {
                localStorage.setItem('cashcounter_config', JSON.stringify(this.config));
            }

            setLanguage(lang) {
                this.language = lang;
                localStorage.setItem('cashcounter_language', lang);
                this.render();
            }

            setFontSize(size) {
                this.fontSize = size;
                localStorage.setItem('cashcounter_fontsize', size);
                this.render();
            }

            handleAnonymousCountChange(denomination, delta) {
                this.state.anonymous[denomination] = Math.max(0, (this.state.anonymous[denomination] || 0) + delta);
                this.saveToStorage();
                this.render();
            }

            handleAnonymousDirectInput(denomination, value) {
                this.state.anonymous[denomination] = Math.max(0, value);
                this.saveToStorage();
                this.render();
            }

            handleNamedCountChange(denomination, delta) {
                this.state.namedCounts[denomination] = Math.max(0, (this.state.namedCounts[denomination] || 0) + delta);
                this.saveToStorage();
                this.render();
            }

            handleNamedDirectInput(denomination, value) {
                this.state.namedCounts[denomination] = Math.max(0, value);
                this.saveToStorage();
                this.render();
            }

            handleClearAll() {
                if (confirm(t('confirmClearAll', this.language))) {
                    this.state = {
                        anonymous: createEmptyState(this.config.currency),
                        namedCounts: createEmptyState(this.config.currency)
                    };
                    this.config.targetAmount = 0;
                    this.saveConfig();
                    localStorage.removeItem('cashcounter_standalone');
                    this.render();
                }
            }

            isStateEmpty() {
                const totalAnonymous = Object.values(this.state.anonymous).reduce((sum, count) => sum + count, 0);
                const totalNamed = Object.values(this.state.namedCounts).reduce((sum, count) => sum + count, 0);
                return totalAnonymous === 0 && totalNamed === 0;
            }

            handleCurrencyChangeRequest(newCurrency) {
                if (this.isStateEmpty()) {
                    this.config.currency = newCurrency;
                    this.state = {
                        anonymous: createEmptyState(newCurrency),
                        namedCounts: createEmptyState(newCurrency)
                    };
                    this.saveConfig();
                    this.render();
                } else {
                    this.currencyChange = {
                        showCurrencyConfirm: true,
                        pendingCurrency: newCurrency
                    };
                    this.render();
                }
            }

            handleCurrencyChangeConfirm() {
                if (this.currencyChange.pendingCurrency) {
                    this.config.currency = this.currencyChange.pendingCurrency;
                    this.state = {
                        anonymous: createEmptyState(this.currencyChange.pendingCurrency),
                        namedCounts: createEmptyState(this.currencyChange.pendingCurrency)
                    };
                    this.currencyChange = {
                        showCurrencyConfirm: false,
                        pendingCurrency: null
                    };
                    this.saveConfig();
                    this.render();
                }
            }

            handleCurrencyChangeCancel() {
                this.currencyChange = {
                    showCurrencyConfirm: false,
                    pendingCurrency: null
                };
                this.render();
            }

            handleShare() {
                const currency = this.config.currency;
                const today = getLocalDateString();
                const lines = [];

                lines.push(`## 🧮 ${t('title', this.language)} — ${today}`);
                lines.push('');

                const namedTotal = calculateDenominationTotal(this.state.namedCounts, currency);
                const namedBreakdown = calculateDenominationBreakdown(this.state.namedCounts, currency);
                const namedHasData = namedTotal > 0;

                const anonymousTotal = calculateDenominationTotal(this.state.anonymous, currency);
                const anonymousBreakdown = calculateDenominationBreakdown(this.state.anonymous, currency);
                const anonymousHasData = anonymousTotal > 0;

                if (namedHasData || anonymousHasData) {
                    const denominations = getDenominations(currency);
                    const bills = filterDenominationsByType(denominations, 'bill');
                    const billsWithData = getDenominationsWithData(bills, this.state.anonymous, this.state.namedCounts);
                    
                    if (billsWithData.length > 0) {
                        lines.push(`### 💵 ${t('bills', this.language)}`);
                        lines.push(`| ${t('denomination', this.language)} | ${t('named', this.language)} | ${t('anonymous', this.language)} |`);
                        lines.push('|---|---|---|');
                        billsWithData.forEach(d => {
                            const nc = this.state.namedCounts[d.value] || 0;
                            const ac = this.state.anonymous[d.value] || 0;
                            lines.push(`| ${d.label} | ${nc > 0 ? nc : '—'} | ${ac > 0 ? ac : '—'} |`);
                        });
                        lines.push('');
                    }

                    const coins = filterDenominationsByType(denominations, 'coin');
                    const coinsWithData = getDenominationsWithData(coins, this.state.anonymous, this.state.namedCounts);
                    
                    if (coinsWithData.length > 0) {
                        lines.push(`### ⚪ ${t('coins', this.language)}`);
                        lines.push(`| ${t('denomination', this.language)} | ${t('named', this.language)} | ${t('anonymous', this.language)} |`);
                        lines.push('|---|---|---|');
                        coinsWithData.forEach(d => {
                            const nc = this.state.namedCounts[d.value] || 0;
                            const ac = this.state.anonymous[d.value] || 0;
                            lines.push(`| ${d.label} | ${nc > 0 ? nc : '—'} | ${ac > 0 ? ac : '—'} |`);
                        });
                        lines.push('');
                    }
                }

                lines.push('---');
                lines.push(`**${t('namedTotal', this.language)}:** ${currency} ${namedTotal.toFixed(2)} (${t('bills', this.language)}: ${currency} ${namedBreakdown.bills.toFixed(2)}, ${t('coins', this.language)}: ${currency} ${namedBreakdown.coins.toFixed(2)})`);
                lines.push('');
                lines.push(`**${t('anonymousTotal', this.language)}:** ${currency} ${anonymousTotal.toFixed(2)} (${t('bills', this.language)}: ${currency} ${anonymousBreakdown.bills.toFixed(2)}, ${t('coins', this.language)}: ${currency} ${anonymousBreakdown.coins.toFixed(2)})`);
                lines.push('');

                const grandTotal = namedTotal + anonymousTotal;
                const grandBreakdown = {
                    bills: namedBreakdown.bills + anonymousBreakdown.bills,
                    coins: namedBreakdown.coins + anonymousBreakdown.coins
                };

                lines.push(`**${t('grandTotal', this.language)}:** ${currency} ${grandTotal.toFixed(2)} (${t('bills', this.language)}: ${currency} ${grandBreakdown.bills.toFixed(2)}, ${t('coins', this.language)}: ${currency} ${grandBreakdown.coins.toFixed(2)})`);
                lines.push('');

                if (this.config.targetAmount > 0) {
                    lines.push(`**${t('transactionsTotal', this.language)}:** ${currency} ${this.config.targetAmount.toFixed(2)}`);
                    lines.push('');

                    const diff = grandTotal - this.config.targetAmount;
                    const absDiff = Math.abs(diff);
                    const tolerance = 0.01;
                    if (absDiff <= tolerance) {
                        lines.push(`✅ **${t('match', this.language)}** — ${currency} ${absDiff.toFixed(2)}`);
                    } else if (diff > 0) {
                        lines.push(`⬆️ **${t('excess', this.language)}** — ${currency} ${absDiff.toFixed(2)}`);
                    } else {
                        lines.push(`⬇️ **${t('shortage', this.language)}** — ${currency} ${absDiff.toFixed(2)}`);
                    }
                }

                const markdown = lines.join('\n');
                navigator.clipboard.writeText(markdown).then(() => {
                    this.copySuccess = true;
                    this.render();
                    setTimeout(() => {
                        this.copySuccess = false;
                        this.render();
                    }, 2000);
                }).catch(() => {
                    const textarea = document.createElement('textarea');
                    textarea.value = markdown;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    this.copySuccess = true;
                    this.render();
                    setTimeout(() => {
                        this.copySuccess = false;
                        this.render();
                    }, 2000);
                });
            }

            getMatchStatus() {
                if (this.config.targetAmount === 0) return 'none';
                const grandTotal = calculateDenominationTotal(this.state.anonymous, this.config.currency) +
                                   calculateDenominationTotal(this.state.namedCounts, this.config.currency);
                const difference = Math.abs(grandTotal - this.config.targetAmount);
                const tolerance = 0.01;
                if (difference <= tolerance) return 'match';
                if (grandTotal > this.config.targetAmount) return 'excess';
                return 'shortage';
            }

            render() {
                const app = document.getElementById('app');
                const denominations = getDenominations(this.config.currency);
                const bills = filterDenominationsByType(denominations, 'bill');
                const coins = filterDenominationsByType(denominations, 'coin');
                const currency = this.config.currency;
                const matchStatus = this.getMatchStatus();

                const anonymousTotal = calculateDenominationTotal(this.state.anonymous, currency);
                const anonymousBreakdown = calculateDenominationBreakdown(this.state.anonymous, currency);
                const namedTotal = calculateDenominationTotal(this.state.namedCounts, currency);
                const namedBreakdown = calculateDenominationBreakdown(this.state.namedCounts, currency);
                const grandTotal = anonymousTotal + namedTotal;
                const grandBreakdown = {
                    bills: anonymousBreakdown.bills + namedBreakdown.bills,
                    coins: anonymousBreakdown.coins + namedBreakdown.coins
                };

                const fontSizeClass = this.fontSize === 'large' ? 'font-large' : this.fontSize === 'extraLarge' ? 'font-extra-large' : '';

                app.innerHTML = `
                    <div class="min-h-screen bg-slate-50 dark:bg-slate-950">
                        <!-- Header -->
                        <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-50 no-scale">
                            <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
                                <div class="flex items-center gap-4">
                                    <h1 class="text-xl font-bold text-slate-900 dark:text-slate-100 flex items-center gap-2">
                                        <span class="text-2xl">🧮</span>
                                        <span class="hidden sm:inline">${t('title', this.language)}</span>
                                    </h1>
                                    ${this.renderCurrencySelector()}
                                </div>
                                <div class="flex items-center gap-2">
                                    <button id="settings-btn" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors" title="Settings">
                                        <span class="text-2xl">⚙️</span>
                                    </button>
                                    ${this.renderLanguageSelector()}
                                </div>
                            </div>

                            ${this.showConfig ? this.renderSettingsPanel() : ''}
                        </header>

                        <!-- Main Content -->
                        <main class="max-w-4xl mx-auto px-4 py-6 scalable-content ${fontSizeClass}">
                            <!-- Column Headers -->
                            <div class="mb-4">
                                <div class="grid grid-cols-[1fr_1fr] gap-2">
                                    <div class="px-2 py-1 bg-blue-50 dark:bg-blue-900/20 rounded-md border border-blue-200 dark:border-blue-800/50">
                                        <div class="text-[10px] font-medium text-blue-700 dark:text-blue-400 text-center">
                                            ${t('named', this.language)}
                                        </div>
                                    </div>
                                    <div class="px-2 py-1 bg-teal-50 dark:bg-teal-900/20 rounded-md border border-teal-200 dark:border-teal-800/50">
                                        <div class="text-[10px] font-medium text-teal-700 dark:text-teal-400 text-center">
                                            ${t('anonymous', this.language)}
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Bills Section -->
                            <div class="mb-6">
                                ${bills.map(denom => this.renderDenominationRow(denom, currency)).join('')}
                            </div>

                            <!-- Coins Section -->
                            <div class="mb-6">
                                ${coins.map(denom => this.renderDenominationRow(denom, currency)).join('')}
                            </div>

                            <!-- Section Totals -->
                            <div class="grid grid-cols-2 gap-3 mb-6">
                                <div class="p-3 bg-blue-50 dark:bg-blue-900/20 rounded-lg border border-blue-200 dark:border-blue-800/50 text-center">
                                    <div class="text-xs font-medium text-blue-700 dark:text-blue-400 mb-1">
                                        ${t('namedTotal', this.language)}
                                    </div>
                                    <div class="text-xl font-bold text-blue-900 dark:text-blue-100 text-center">
                                        ${formatCurrencyAmount(namedTotal, currency)}
                                    </div>
                                </div>
                                <div class="p-3 bg-teal-50 dark:bg-teal-900/20 rounded-lg border border-teal-200 dark:border-teal-800/50 text-center">
                                    <div class="text-xs font-medium text-teal-700 dark:text-teal-400 mb-1">
                                        ${t('anonymousTotal', this.language)}
                                    </div>
                                    <div class="text-xl font-bold text-teal-900 dark:text-teal-100 text-center">
                                        ${formatCurrencyAmount(anonymousTotal, currency)}
                                    </div>
                                </div>
                            </div>

                            <!-- Grand Total & Match Status -->
                            <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 reduced-scale">
                                <!-- Grand Total Breakdown -->
                                <div class="grid grid-cols-2 gap-3 mb-6">
                                    <div class="bg-yellow-50 dark:bg-yellow-900/20 px-4 py-3 rounded-lg border border-yellow-200 dark:border-yellow-800/50 text-center">
                                        <div class="text-xs font-medium text-slate-700 dark:text-slate-300 mb-1">
                                            💵 ${t('bills', this.language)}
                                        </div>
                                        <div class="text-lg font-bold dark:text-white">
                                            ${formatCurrencyAmount(grandBreakdown.bills, currency)}
                                        </div>
                                    </div>
                                    <div class="bg-gray-100 dark:bg-slate-700 px-4 py-3 rounded-lg border border-gray-200 dark:border-slate-600 text-center">
                                        <div class="text-xs font-medium text-slate-700 dark:text-slate-300 mb-1">
                                            ⚪ ${t('coins', this.language)}
                                        </div>
                                        <div class="text-lg font-bold dark:text-white">
                                            ${formatCurrencyAmount(grandBreakdown.coins, currency)}
                                        </div>
                                    </div>
                                </div>

                                <div class="text-right mb-6">
                                    <div class="text-xl font-bold text-slate-900 dark:text-slate-100 mb-1">
                                        ${t('grandTotal', this.language)}:
                                    </div>
                                    <div class="text-4xl font-black dark:text-white ${
                                        matchStatus === 'match' ? 'text-green-600 dark:text-green-400' :
                                        matchStatus === 'excess' ? 'text-blue-600 dark:text-blue-400' :
                                        matchStatus === 'shortage' ? 'text-red-600 dark:text-red-400' :
                                        'text-slate-900 dark:text-slate-100'
                                    }">
                                        ${formatCurrencyAmount(grandTotal, currency)}
                                    </div>
                                </div>

                                ${this.config.targetAmount > 0 ? this.renderTargetAmount(grandTotal, matchStatus, currency) : ''}

                                <!-- Action Buttons -->
                                <div class="flex justify-between items-center mt-6 pt-6 border-t border-slate-200 dark:border-slate-700 reduced-scale">
                                    <button id="clear-btn" type="button" class="min-w-[100px] px-6 py-2 rounded-lg flex items-center justify-center text-red-600 dark:text-red-400 hover:text-red-700 dark:hover:text-red-300 hover:bg-red-50 dark:hover:bg-red-900/20">
                                        ${t('clearAll', this.language)}
                                    </button>
                                    <button id="share-btn" type="button" class="min-w-[100px] px-6 py-2 rounded-lg flex items-center justify-center transition-colors font-medium text-nowrap ${
                                        this.copySuccess ? 'bg-green-100 dark:bg-green-900/20 text-green-600 dark:text-green-400' :
                                        'bg-indigo-100 dark:bg-indigo-900/20 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-200 dark:hover:bg-indigo-900/30'
                                    }">
                                        ${this.copySuccess ? t('copied', this.language) : t('share', this.language)}
                                    </button>
                                </div>
                            </div>
                        </main>

                        ${this.renderCurrencyConfirmModal()}
                    </div>
                `;

                this.attachEventListeners();
            }

            renderCurrencySelector() {
                const currentCurrency = getCurrencyInfo(this.config.currency);
                return `
                    <div class="relative">
                        <button id="currency-btn" class="flex items-center gap-2 px-3 py-2 rounded-lg bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800/50 hover:bg-blue-100 dark:hover:bg-blue-900/30 transition-colors" aria-expanded="false" aria-haspopup="true">
                            <span class="text-xl">${currentCurrency.flag}</span>
                            <span class="text-sm font-bold text-blue-700 dark:text-blue-300 whitespace-nowrap">${currentCurrency.name}</span>
                        </button>
                        <div id="currency-dropdown" class="hidden fixed inset-0 z-[199]" onclick=""></div>
                        <div id="currency-menu" class="hidden absolute right-0 mt-2 min-w-max bg-white dark:bg-slate-800 rounded-lg shadow-lg border border-slate-200 dark:border-slate-700 z-[200] overflow-hidden max-h-60 overflow-y-auto">
                            ${getSupportedCurrencies().map(c => `
                                <button type="button" class="currency-option w-full flex items-center gap-3 px-4 py-3 text-sm hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors ${this.config.currency === c.code ? 'bg-blue-50 dark:bg-blue-900/20' : ''}" data-currency="${c.code}">
                                    <span class="text-xl">${c.flag}</span>
                                    <span class="font-medium">${c.name}</span>
                                    <span class="text-xs text-slate-500 dark:text-slate-400 ml-auto">${c.code}</span>
                                    ${this.config.currency === c.code ? '<span class="ml-2 text-blue-600 dark:text-blue-400">✓</span>' : ''}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            renderLanguageSelector() {
                const currentLang = LANGUAGES.find(l => l.code === this.language) || LANGUAGES[0];
                return `
                    <div class="relative">
                        <button id="language-btn" class="flex items-center gap-1.5 px-3 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors" aria-expanded="false" aria-haspopup="true">
                            <span class="text-xl leading-none">${currentLang.flag}</span>
                            <span class="text-sm font-medium text-slate-700 dark:text-slate-300">${currentLang.name}</span>
                        </button>
                        <div id="language-dropdown" class="hidden fixed inset-0 z-[199]" onclick=""></div>
                        <div id="language-menu" class="hidden absolute right-0 mt-2 min-w-max bg-white dark:bg-slate-800 rounded-lg shadow-lg border border-slate-200 dark:border-slate-700 z-[200] overflow-hidden">
                            ${LANGUAGES.map(language => `
                                <button type="button" class="language-option w-full flex items-center gap-3 px-4 py-3 text-sm hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors ${this.language === language.code ? 'bg-primary-50 dark:bg-slate-700' : ''}" data-language="${language.code}">
                                    <span class="text-xl leading-none">${language.flag}</span>
                                    <span class="font-medium whitespace-nowrap">${language.name}</span>
                                    ${this.language === language.code ? '<span class="ml-4 text-primary-600 dark:text-blue-400">✓</span>' : ''}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            renderSettingsPanel() {
                return `
                    <div class="border-t border-slate-200 dark:border-slate-700 px-4 py-4 bg-slate-50 dark:bg-slate-900/50">
                        <div class="max-w-4xl mx-auto">
                            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">
                                ${t('targetAmount', this.language)}
                            </label>
                            <div class="flex gap-2 items-center">
                                <span class="text-slate-500 dark:text-slate-400">${this.config.currency}</span>
                                <input id="target-amount" type="number" step="0.01" min="0" inputmode="decimal" class="flex-1 px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="0" value="${this.config.targetAmount === 0 ? '' : this.config.targetAmount}">
                            </div>

                            <!-- Font Size Selector -->
                            <div class="mt-4">
                                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">
                                    Font Size
                                </label>
                                <div class="grid grid-cols-3 gap-2">
                                    <button type="button" class="font-size-btn px-3 py-2 rounded-lg text-sm font-medium transition-colors ${this.fontSize === 'normal' ? 'bg-blue-600 text-white' : 'bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-600'}" data-size="normal">Normal</button>
                                    <button type="button" class="font-size-btn px-3 py-2 rounded-lg text-sm font-medium transition-colors ${this.fontSize === 'large' ? 'bg-blue-600 text-white' : 'bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-600'}" data-size="large">Large</button>
                                    <button type="button" class="font-size-btn px-3 py-2 rounded-lg text-sm font-medium transition-colors ${this.fontSize === 'extraLarge' ? 'bg-blue-600 text-white' : 'bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-600'}" data-size="extraLarge">XL</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            renderDenominationRow(denomination, currency) {
                const namedCount = this.state.namedCounts[denomination.value] || 0;
                const anonymousCount = this.state.anonymous[denomination.value] || 0;
                return `
                    <div class="mb-4">
                        <div class="text-xs sm:text-sm font-black text-center mb-2">
                            ${denomination.label}
                        </div>
                        <div class="grid grid-cols-[1fr_1fr] gap-2 mb-1">
                            ${this.renderDenominationControls(denomination.value, namedCount, 'blue', 'named')}
                            ${this.renderDenominationControls(denomination.value, anonymousCount, 'teal', 'anonymous')}
                        </div>
                        <div class="grid grid-cols-[1fr_1fr] gap-2 mt-1">
                            <div class="text-[9px] font-medium text-blue-600 dark:text-blue-400 text-center">
                                ${formatCurrencyAmount(namedCount * denomination.value, currency)}
                            </div>
                            <div class="text-[9px] font-medium text-teal-600 dark:text-teal-400 text-center">
                                ${formatCurrencyAmount(anonymousCount * denomination.value, currency)}
                            </div>
                        </div>
                    </div>
                `;
            }

            renderDenominationControls(denomination, count, color, type) {
                const colorClasses = {
                    teal: {
                        minus: 'bg-red-500 hover:bg-red-600 disabled:bg-red-300',
                        plus: 'bg-green-500 hover:bg-green-600',
                        container: 'bg-teal-50 dark:bg-teal-900/20 border-teal-200 dark:border-teal-800/50',
                        input: 'border-gray-300 dark:border-slate-600 focus:ring-teal-500 dark:bg-slate-700 dark:text-white'
                    },
                    blue: {
                        minus: 'bg-red-500 hover:bg-red-600 disabled:bg-red-300',
                        plus: 'bg-green-500 hover:bg-green-600',
                        container: 'bg-blue-50 dark:bg-blue-900/20 border-blue-200 dark:border-blue-800/50',
                        input: 'border-gray-300 dark:border-slate-600 focus:ring-blue-500 dark:bg-slate-700 dark:text-white'
                    }
                };

                const classes = colorClasses[color];
                return `
                    <div class="flex flex-col gap-1 items-center">
                        <div class="p-1 rounded-md border ${classes.container} w-full">
                            <input type="number" inputmode="decimal" min="0" max="999" class="denom-input text-center font-semibold w-full border rounded focus:outline-none focus:ring-2 py-1 px-2 ${classes.input}" value="${count || 0}" placeholder="0" data-denomination="${denomination}" data-type="${type}">
                        </div>
                        <div class="flex gap-1 items-center w-full justify-center">
                            <button type="button" class="denom-minus w-8 h-8 rounded ${classes.minus} text-white font-bold text-xs disabled:opacity-30 flex items-center justify-center" ${count === 0 ? 'disabled' : ''} data-denomination="${denomination}" data-type="${type}">−</button>
                            <button type="button" class="denom-plus w-8 h-8 rounded ${classes.plus} text-white font-bold text-xs flex items-center justify-center" data-denomination="${denomination}" data-type="${type}">+</button>
                        </div>
                    </div>
                `;
            }

            renderTargetAmount(grandTotal, matchStatus, currency) {
                const diff = Math.abs(grandTotal - this.config.targetAmount);
                const statusClass = matchStatus === 'match' ? 'bg-green-100 dark:bg-green-900/20 text-green-800 dark:text-green-400' :
                                   matchStatus === 'excess' ? 'bg-blue-100 dark:bg-blue-900/20 text-blue-800 dark:text-blue-400' :
                                   'bg-red-100 dark:bg-red-900/20 text-red-800 dark:text-red-400';
                
                const statusText = matchStatus === 'match' ? `✓ ${t('match', this.language)}` :
                                  matchStatus === 'excess' ? `↑ ${t('excess', this.language)}` :
                                  `↓ ${t('shortage', this.language)}`;

                return `
                    <div class="text-right p-4 rounded-lg ${statusClass}">
                        <div class="text-lg font-bold mb-2">
                            ${t('transactionsTotal', this.language)}: ${formatCurrencyAmount(this.config.targetAmount, currency)}
                        </div>
                        <div class="border-t border-black/20 dark:border-white/20 my-2"></div>
                        <div class="font-semibold mb-1">
                            ${statusText}
                        </div>
                        <div class="font-bold text-xl">
                            ${formatCurrencyAmount(diff, currency)}
                        </div>
                    </div>
                `;
            }

            renderCurrencyConfirmModal() {
                if (!this.currencyChange.showCurrencyConfirm) return '';
                return `
                    <div class="fixed inset-0 bg-black/50 z-[298]" id="currency-modal-overlay"></div>
                    <div class="fixed inset-0 z-[299] flex items-center justify-center p-4">
                        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-2xl max-w-md w-full p-6 border border-slate-200 dark:border-slate-700">
                            <h2 class="text-xl font-bold text-slate-900 dark:text-slate-100 mb-4 flex items-center gap-2">
                                <span>⚠️</span>
                                <span>Confirm Currency Change</span>
                            </h2>
                            <p class="text-slate-700 dark:text-slate-300 mb-6">
                                You have denomination counts in the current currency. Changing currency will reset all denomination counts to zero.
                            </p>
                            <div class="flex gap-3 justify-end">
                                <button id="currency-cancel-btn" type="button" class="px-4 py-2 rounded-lg text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors font-medium">
                                    Cancel
                                </button>
                                <button id="currency-confirm-btn" type="button" class="px-4 py-2 rounded-lg bg-red-600 dark:bg-red-700 hover:bg-red-700 dark:hover:bg-red-600 text-white transition-colors font-medium">
                                    Change Currency & Reset
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            attachEventListeners() {
                // Settings button
                document.getElementById('settings-btn')?.addEventListener('click', () => {
                    this.showConfig = !this.showConfig;
                    this.render();
                });

                // Currency selector
                const currencyBtn = document.getElementById('currency-btn');
                const currencyDropdown = document.getElementById('currency-dropdown');
                const currencyMenu = document.getElementById('currency-menu');
                
                currencyBtn?.addEventListener('click', (e) => {
                    e.stopPropagation();
                    currencyDropdown?.classList.toggle('hidden');
                    currencyMenu?.classList.toggle('hidden');
                });

                currencyDropdown?.addEventListener('click', () => {
                    currencyDropdown.classList.add('hidden');
                    currencyMenu?.classList.add('hidden');
                });

                document.querySelectorAll('.currency-option').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const newCurrency = btn.dataset.currency;
                        this.handleCurrencyChangeRequest(newCurrency);
                        currencyDropdown?.classList.add('hidden');
                        currencyMenu?.classList.add('hidden');
                    });
                });

                // Language selector
                const languageBtn = document.getElementById('language-btn');
                const languageDropdown = document.getElementById('language-dropdown');
                const languageMenu = document.getElementById('language-menu');

                languageBtn?.addEventListener('click', (e) => {
                    e.stopPropagation();
                    languageDropdown?.classList.toggle('hidden');
                    languageMenu?.classList.toggle('hidden');
                });

                languageDropdown?.addEventListener('click', () => {
                    languageDropdown.classList.add('hidden');
                    languageMenu?.classList.add('hidden');
                });

                document.querySelectorAll('.language-option').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        this.setLanguage(btn.dataset.language);
                        languageDropdown?.classList.add('hidden');
                        languageMenu?.classList.add('hidden');
                    });
                });

                // Target amount input
                document.getElementById('target-amount')?.addEventListener('change', (e) => {
                    const value = e.target.value.trim();
                    const numValue = value === '' ? 0 : parseFloat(value);
                    this.config.targetAmount = isNaN(numValue) ? 0 : numValue;
                    this.saveConfig();
                    this.render();
                });

                // Font size buttons
                document.querySelectorAll('.font-size-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        this.setFontSize(btn.dataset.size);
                    });
                });

                // Denomination controls
                document.querySelectorAll('.denom-minus').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const denomination = parseFloat(btn.dataset.denomination);
                        const type = btn.dataset.type;
                        if (type === 'named') {
                            this.handleNamedCountChange(denomination, -1);
                        } else {
                            this.handleAnonymousCountChange(denomination, -1);
                        }
                    });
                });

                document.querySelectorAll('.denom-plus').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const denomination = parseFloat(btn.dataset.denomination);
                        const type = btn.dataset.type;
                        if (type === 'named') {
                            this.handleNamedCountChange(denomination, 1);
                        } else {
                            this.handleAnonymousCountChange(denomination, 1);
                        }
                    });
                });

                document.querySelectorAll('.denom-input').forEach(input => {
                    input.addEventListener('blur', () => {
                        const denomination = parseFloat(input.dataset.denomination);
                        const value = parseInt(input.value) || 0;
                        const type = input.dataset.type;
                        if (type === 'named') {
                            this.handleNamedDirectInput(denomination, value);
                        } else {
                            this.handleAnonymousDirectInput(denomination, value);
                        }
                    });

                    input.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') {
                            const denomination = parseFloat(input.dataset.denomination);
                            const value = parseInt(input.value) || 0;
                            const type = input.dataset.type;
                            if (type === 'named') {
                                this.handleNamedDirectInput(denomination, value);
                            } else {
                                this.handleAnonymousDirectInput(denomination, value);
                            }
                            input.blur();
                        }
                    });
                });

                // Action buttons
                document.getElementById('clear-btn')?.addEventListener('click', () => {
                    this.handleClearAll();
                });

                document.getElementById('share-btn')?.addEventListener('click', () => {
                    this.handleShare();
                });

                // Currency confirm modal
                document.getElementById('currency-confirm-btn')?.addEventListener('click', () => {
                    this.handleCurrencyChangeConfirm();
                });

                document.getElementById('currency-cancel-btn')?.addEventListener('click', () => {
                    this.handleCurrencyChangeCancel();
                });

                document.getElementById('currency-modal-overlay')?.addEventListener('click', () => {
                    this.handleCurrencyChangeCancel();
                });

                // Close dropdowns on outside click
                document.addEventListener('click', (e) => {
                    if (!currencyBtn?.contains(e.target) && !currencyMenu?.contains(e.target)) {
                        currencyDropdown?.classList.add('hidden');
                        currencyMenu?.classList.add('hidden');
                    }
                    if (!languageBtn?.contains(e.target) && !languageMenu?.contains(e.target)) {
                        languageDropdown?.classList.add('hidden');
                        languageMenu?.classList.add('hidden');
                    }
                });
            }
        }

        // Initialize app
        window.addEventListener('DOMContentLoaded', () => {
            new CashCounterApp();
        });
    </script>
</body>
</html>
